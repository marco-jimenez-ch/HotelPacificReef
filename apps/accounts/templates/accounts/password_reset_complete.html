{% extends 'base.html' %}
{% block title %}Contraseña Restablecida — Hotel Pacific Reef{% endblock %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-5 col-lg-4">
    <div class="card-form">
      <div class="card-form-header text-center" style="background: linear-gradient(135deg, #198754, #0077B6);">
        <div class="mb-3">
          <span class="rounded-circle bg-white d-inline-flex align-items-center justify-content-center" style="width:56px;height:56px;">
            <i class="bi bi-check-circle text-success" style="font-size:1.6rem;"></i>
          </span>
        </div>
        <h4 class="fw-bold text-white mb-1" style="font-family:'Playfair Display',serif;">¡Listo!</h4>
        <p class="text-white-50 small mb-0">Tu contraseña fue restablecida</p>
      </div>
      <div class="p-4 bg-white text-center">
        <p class="text-muted mb-4">Tu contraseña se actualizó correctamente. Ya puedes iniciar sesión.</p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-semibold"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
